# Odoo's directory: the addresses Odoo answers (mail_gateway_recipient) and its mailboxes with their mail keys
# (mail_mailbox, mail_mailbox_key), read by a role that can read nothing else:
#   CREATE ROLE james_odoo_reader LOGIN PASSWORD '...';
#   GRANT CONNECT ON DATABASE <odoo database> TO james_odoo_reader;
#   GRANT USAGE ON SCHEMA public TO james_odoo_reader;
#   GRANT SELECT ON mail_gateway_recipient, mail_mailbox, mail_mailbox_key TO james_odoo_reader;
database.url=${env:JAMES_ODOO_DATABASE_URL}
database.user=james_odoo_reader
database.password=${env:JAMES_ODOO_DATABASE_PASSWORD}
# An alias created or archived in Odoo is accepted or refused at RCPT within this interval. Default 30s.
refresh.interval=30s
# James's users are Odoo's mailboxes (a user with "Mailbox" set), and they sign in with the mail keys they make in
# their Odoo preferences, one per device. James's own users table is not used.
users.enabled=true
