# Odoo's mail gateway addresses, read from its mail_gateway_recipient view by a role that can read nothing else:
#   CREATE ROLE james_odoo_reader LOGIN PASSWORD '...';
#   GRANT CONNECT ON DATABASE <odoo database> TO james_odoo_reader;
#   GRANT USAGE ON SCHEMA public TO james_odoo_reader;
#   GRANT SELECT ON mail_gateway_recipient TO james_odoo_reader;
database.url=jdbc:postgresql://odoo-db.example.com:5432/odoo?sslmode=verify-full
database.user=james_odoo_reader
database.password=secret
# An alias created or archived in Odoo is accepted or refused at RCPT within this interval. Default 30s.
refresh.interval=30s
